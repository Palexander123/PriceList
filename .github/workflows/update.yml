name: Update offers and publish site

on:
  schedule:
    # 05:30 UTC = 07:30 (winter) / 06:30 (summer) in Denmark
    - cron: "30 5 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch offers
        env:
          SALLING_API_KEY: ${{ secrets.SALLING_API_KEY }}
        run: python fetch_offers.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
